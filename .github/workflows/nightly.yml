name: nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  # The full dry bench: every prompt, at every scope tier, through the whole create pipeline. One job per genre so the
  # genres run side by side; a dry bench fails on any failed prompt, since the harness is deterministic.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        genre: [platformer, survivors, topdown-action, shmup, metroidvania, puzzle]
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright is a dependency of @gg/bots, not of the workspace root
      - run: pnpm --filter @gg/bots exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm bench --genre ${{ matrix.genre }} --k 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.genre }}
          path: tools/evals/reports/
          if-no-files-found: ignore
