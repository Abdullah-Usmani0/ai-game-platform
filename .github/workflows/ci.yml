name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright is a dependency of @gg/bots, not of the workspace root
      - run: pnpm --filter @gg/bots exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm demo
      - run: pnpm --filter @gg/web bundles:sample && pnpm --filter @gg/web build && pnpm --filter @gg/web check:bridge && pnpm --filter @gg/web check:create
      - run: pnpm bench --limit 2 --k 1
